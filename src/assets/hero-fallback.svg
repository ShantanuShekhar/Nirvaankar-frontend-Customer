<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Nature inspired craft">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2419"/>
      <stop offset="55%" stop-color="#1f3d2b"/>
      <stop offset="100%" stop-color="#14301f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76D713"/>
      <stop offset="100%" stop-color="#109648"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="620" cy="180" r="90" fill="#76D713" opacity="0.18" filter="url(#soft)"/>
  <path d="M120 780 C220 520, 360 420, 520 360 C390 470, 300 620, 260 820 Z" fill="url(#leaf)" opacity="0.9"/>
  <path d="M280 820 C360 610, 500 500, 680 430 C560 560, 470 700, 430 860 Z" fill="#109648" opacity="0.75"/>
  <path d="M180 860 C250 700, 340 620, 460 560" stroke="#cfe8b8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="400" cy="900" rx="220" ry="28" fill="#000" opacity="0.35"/>
</svg>
